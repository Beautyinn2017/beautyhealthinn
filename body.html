*{
margin:0;
padding:0;

html{

body{

img{

/* NAV */

.header{
position:fixed;
width:100%;
padding:15px 60px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(245,237,230,0.92);
backdrop-filter:blur(10px);
z-index:1000;
top:0;
left:0;
}

.logo{
font-family:'Cormorant Garamond',serif;
font-size:18px;
letter-spacing:1px;
white-space:nowrap;
flex-shrink:0;
display:flex;
align-items:center;
gap:12px;
font-weight:500;
}

.logo img{
max-width:60px;
height:auto;
display:block;
}
  
nav{
display:flex;
}
  
.nav-links{
display:flex;
gap:42px;
font-size:12px;
font-family:'League Spartan',sans-serif;
font-weight:300;
list-style:none;
margin:0;
}

.nav-links a{
transition:opacity 0.3s ease;
}

.nav-links a:hover{
opacity:0.6;
}
